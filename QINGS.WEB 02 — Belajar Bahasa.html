<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QINGS.WEB — Belajar Bahasa</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root{--bg:#080808;--card:#141414;--line:#262626;--tx:#f2f2f2;--mu:#9a9a9a;--ac:#ff5a36;--ok:#3ddc97;--bad:#ff5d6c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f6f6f4;--card:#fff;--line:#dcdcd8;--tx:#141414;--mu:#666;color-scheme:light}}
:root[data-theme="dark"]{--bg:#080808;--card:#141414;--line:#262626;--tx:#f2f2f2;--mu:#9a9a9a}
*{box-sizing:inherit}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-size:20px;font-weight:500;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:20px 18px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;font-size:15px;color:var(--mu);letter-spacing:.08em}
header b{color:var(--tx);letter-spacing:.2em}
button{font:inherit;color:inherit;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--mu)}
h1{font-family:"Cinzel Decorative","Cinzel",Georgia,serif;font-size:clamp(22px,4.6vw,30px);font-weight:700;letter-spacing:.02em;margin:0 0 8px;line-height:1.2}
.sub{color:var(--mu);font-size:22px;font-style:italic;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.opt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;transition:transform .2s,border-color .2s}
.opt:hover{border-color:var(--ac);transform:translateY(-2px)}
.opt small{display:block;color:var(--mu);font-size:16px;margin-top:4px}
.opt .n{color:var(--ac);font-size:12px;letter-spacing:.1em}
.rm *{transition:none!important;animation:none!important}
.tabs{display:flex;gap:6px;margin:18px 0}
.tab{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
.tab[aria-selected=true]{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac);transition:width .4s}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.word{font-family:"Cinzel",Georgia,serif;font-size:40px;font-weight:700;margin:6px 0}
.ans{display:grid;gap:8px;margin-top:12px}
.ans button{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.ans button.ok{border-color:var(--ok);background:rgba(61,220,151,.12)}
.ans button.bad{border-color:var(--bad);background:rgba(255,93,108,.12)}
input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--tx);font:inherit}
.mu{color:var(--mu);font-size:16px}.done{color:var(--ok)}
header b,.opt b,.tab,.lvl{font-family:"Cinzel",Georgia,serif;letter-spacing:.06em}
.opt b{font-size:17px}.tab{font-size:15px}.lvl{font-size:13px}
[dir=rtl]{font-family:"Amiri",serif}
.lvl{display:inline-block;background:var(--ac);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
.save{background:none;border:0;font-size:18px;color:var(--mu)}.save.on{color:var(--ac)}
ol{padding-left:20px;margin:0}li{padding:8px 0;border-bottom:1px solid var(--line)}
.tabs{overflow-x:auto;scrollbar-width:none}.tab{flex:0 0 auto;padding:10px 16px;white-space:nowrap}
.dict{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}.dict .card{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.ar{font-family:"Amiri",serif;font-size:30px;line-height:1.4}
.lb{display:block;color:var(--ac);font-size:13px;letter-spacing:.1em;margin:12px 0 4px}
body{overflow-x:hidden}
.stage{--S:min(90vw,400px);width:var(--S);height:var(--S);margin:18px auto 8px;position:relative}
.stage::before{content:"";position:absolute;inset:10%;border-radius:50%;border:1px solid rgba(217,169,58,.35);box-shadow:0 0 40px rgba(217,169,58,.15) inset}
.ring{position:absolute;inset:0;animation:spin 50s linear infinite}
.slot{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateY(calc(var(--S)*-.4)) rotate(calc(var(--a)*-1))}
.bi{position:absolute;width:80px;margin:-34px 0 0 -40px;display:flex;flex-direction:column;align-items:center;gap:4px;animation:spinr 50s linear infinite}
.stage:hover .ring,.stage:hover .bi{animation-play-state:paused}
.orb{width:58px;height:58px;border-radius:50%;border:2px solid #d9a93a;background:radial-gradient(circle at 30% 25%,#3a2d12,#15110a);color:#ffd77a;font-family:"Cinzel",serif;font-size:24px;box-shadow:0 0 18px rgba(255,200,80,.35);padding:0;transition:transform .2s}
.orb:hover{transform:scale(1.12)}.g-ar{font-family:"Amiri",serif;font-size:30px}.g-about{font-style:italic;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:30px}
.tip{font-family:"Cinzel",serif;font-size:11px;letter-spacing:.04em;color:var(--mu);text-align:center;white-space:nowrap}
.pos{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.drop{position:relative;pointer-events:auto;transform-origin:50% -40%}
.qbtn{background:none;border:0;padding:0;display:block}
.qbtn img{height:calc(var(--S)*.55);width:auto;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.35));animation:bob 3.2s ease-in-out infinite}
.rope{position:absolute;left:50%;bottom:88%;width:3px;height:100vh;transform:translateX(-50%);background:linear-gradient(#ffe39a,#b8862b);opacity:0}
.stage.intro .drop{animation:drop 3.6s both}.stage.intro .rope{animation:rope 3.6s both}
.stage.intro .orb,.stage.intro .tip{animation:popo .7s 3.4s backwards}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinr{to{transform:rotate(-360deg)}}
@keyframes bob{50%{transform:translateY(-6px) scale(1.012,.99)}}@keyframes shad{50%{transform:translateX(-50%) scale(.82);opacity:.6}}@keyframes aura{50%{opacity:.55;transform:scale(1.06)}}@keyframes popo{from{transform:scale(0);opacity:0}}
@keyframes rope{0%,60%{opacity:1}62%,100%{opacity:0}}
@keyframes drop{0%{transform:translateY(-95vh)}22%{transform:translateY(-42%);animation-timing-function:ease-in-out}30%{transform:translateY(-42%) rotate(5deg)}38%{transform:translateY(-42%) rotate(-5deg)}46%{transform:translateY(-42%) rotate(4deg)}54%{transform:translateY(-42%) rotate(-3deg)}61%{transform:translateY(-42%) rotate(0);animation-timing-function:cubic-bezier(.55,0,1,.6)}80%{transform:translateY(0)}84%{transform:translateY(0) scale(1.08,.9)}90%{transform:translateY(-14px) scale(.98,1.03)}100%{transform:translateY(0)}}
.say{display:flex;gap:12px;align-items:flex-start;margin-top:6px}.who{font-family:"Cinzel",serif;color:var(--ac);letter-spacing:.1em}
.qm{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:8px;z-index:5}
.qm button{width:64px;height:64px;padding:0;border-radius:50%;border:2px solid #d9a93a;overflow:hidden;background:var(--card);box-shadow:0 0 16px rgba(255,200,80,.35)}
.qm img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.qmb{max-width:200px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:15px;opacity:0;transition:opacity .3s}
.rk{list-style:none;padding:0;margin:0}.rk li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.rk li:last-child{border:0}
.rk .nm{flex:1}.rk .me{color:var(--ac)}.no{width:28px;text-align:center;font-family:"Cinzel",serif;font-weight:700;color:var(--mu)}.n1{color:#e8b923}.n2{color:#b7c0c9}.n3{color:#cd7f32}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-family:"Cinzel",serif}
.qbtn img{transform-origin:50% 100%}.drop::after{content:"";position:absolute;left:50%;bottom:-4px;width:62%;height:14px;transform:translateX(-50%);background:radial-gradient(ellipse,rgba(0,0,0,.45),transparent 70%);z-index:-1;animation:shad 3.2s ease-in-out infinite}
.stage::after{content:"";position:absolute;inset:20%;border-radius:50%;background:radial-gradient(circle,rgba(255,200,90,.24),transparent 65%);animation:aura 4s ease-in-out infinite;z-index:0;pointer-events:none}.pos{z-index:1}.ring{z-index:2}
.sw{display:inline-block;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);vertical-align:middle;margin-right:8px}
.sep{border:0;border-top:1px solid var(--line)}.ar.en{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;font-weight:600}
</style></head><body>

function react(g){face(g?"smile":"sad",g?["Mantap!","Benar sekali!","Hebat, lanjut!"][Math.random()*3|0]:"Hampir! Coba lagi.")}
function tip(){face("surprised",["Satu kata sehari, lama-lama jadi fasih.","Ulangi kata yang salah, ya.","Simpan kata favoritmu dengan ★."][Math.random()*3|0])}
function home(){const ORB=[["ar","ع","Bahasa Arab"],["en","Aa","Bahasa Inggris"],["about","i","Tentang"],["more","✦","Lainnya"]];
 return`<h1>Apa yang kamu cari di sini?</h1><p class="sub">Pilih langkahmu, dan kejarlah impian itu.</p>
<div class="stage${introNow?" intro":""}"><div class="ring">${ORB.map((o,i)=>`<div class="slot" style="--a:${i*90}deg"><div class="bi"><button class="orb" data-go="${o[0]}" aria-label="${o[2]}"><span class="g-${o[0]}">${o[1]}</span></button><span class="tip">${o[2]}</span></div></div>`).join("")}</div>
<div class="pos"><div class="drop"><i class="rope"></i><button class="qbtn" data-qio aria-label="Ajak QIO bicara"><img id="qio" src="${IMG[pose]}" alt="QIO" draggable="false"></button></div></div></div>
<div class="card say"><b class="who">QIO</b><div id="bt">${bubHTML}</div></div>`}
function stems(w){const c=new Set([w]);[["meng",["","k"]],["meny",["s"]],["men",["","t"]],["mem",["","p"]],["me",[""]],["ber",[""]],["ter",[""]],["di",[""]],["pe",[""]],["per",[""]],["ke",[""]],["se",[""]]].forEach(([p,ad])=>{if(w.startsWith(p)&&w.length>p.length+2)ad.forEach(x=>c.add(x+w.slice(p.length)))});[...c].forEach(x=>["kan","an","i"].forEach(u=>{if(x.endsWith(u)&&x.length>u.length+2)c.add(x.slice(0,-u.length))}));return[...c]}
const COL={merah:"#e63946",biru:"#1d70e0",hijau:"#2e9e5b",kuning:"#f4c430",putih:"#ffffff",hitam:"#111111","abu-abu":"#8a8f98",cokelat:"#7b4a2b",oranye:"#f28c28",ungu:"#7e4bd6","merah muda":"#f59cb8","warna emas":"#d4a72c","warna perak":"#c0c0c0"};
function kamus(){const ar=lang==="ar",t=term.trim().toLowerCase(),src=ar?DICT:EN,cs=stems(t),r=t.length>1?(src.filter(e=>cs.includes(e.id)).length?src.filter(e=>cs.includes(e.id)):src.filter(e=>e.id.includes(t))).slice(0,4):[];
 const A=(x,l)=>`<div class="ar${ar?"":" en"}"${ar?' dir="rtl"':""}>${esc(x)}</div>${l?`<span class="mu">${esc(l)}</span>`:""}`;
 const res=r.map(e=>{const n=ar?e.n:[e.w,""];return(COL[e.id]?`<span class="sw" style="background:${COL[e.id]}"></span>`:"")+(n[0]?`<span class="lb">KATA BENDA / SIFAT</span>${A(n[0],n[1])}`:"")+(ar&&e.p?`<span class="lb">${e.c==="warna"?"BENTUK PEREMPUAN":"JAMAK"}</span>${A(e.p[0],e.p[1])}`:"")+(ar?(e.v?`<span class="lb">KATA KERJA</span>${A(e.v[0][0],e.v[0][1]+" · telah "+e.id)}${A(e.v[1][0],e.v[1][1]+" · sedang "+e.id)}`:""):(e.b?`<span class="lb">KATA KERJA</span>${A(e.b,"dasar")}${A(e.p,"telah "+e.id)}${A(e.g,"sedang "+e.id)}`:""))}).join("<hr class='sep'>");
 return`<div class="dict"><div class="card"><span class="mu">Indonesia</span><input id="s" placeholder="Ketik kata, mis. pergi" value="${esc(term)}" autocomplete="off"><div class="chips">${src.slice(0,6).map(e=>`<button class="ghost" data-chip="${e.id}">${e.id}</button>`).join("")}</div></div><div class="card"><span class="mu">${ar?"Arab":"Inggris"}</span>${!t?`<p class="mu">Terjemahan muncul di sini.</p>`:!r.length?`<p class="mu">Kata belum ada di kamus.</p>`:res}</div></div>`}
function ranking(){const rows=board?board.slice():[];if(!rows.some(r=>r.me))rows.push({name:S.name||"Kamu",xp:total(),me:true});const mi=rows.findIndex(r=>r.me);
 return`<div class="card"><span class="mu">Nama di ranking</span><input id="nm" maxlength="16" placeholder="Isi namamu agar masuk ranking" value="${esc(S.name)}"></div>
<div class="card row"><span class="mu">Peringkatmu</span><b>${board?"#"+(mi+1):"—"} · ${total()} XP</b></div>
<div class="card" style="padding:6px 14px"><ol class="rk">${rows.map((r,i)=>`<li class="${r.me?"me":""}"><span class="no n${i<3?i+1:0}">${i+1}</span><span class="av">${esc((r.name||"?")[0].toUpperCase())}</span><span class="nm">${esc(r.name)}${r.me?" (kamu)":""}</span><b>${r.xp} XP</b></li>`).join("")}</ol></div>
<p class="mu">${board?"Skor total semua bahasa. Siapa pun bisa melampauimu.":"Mode lokal. Ranking bersama aktif bila kamu masuk dengan akun yang punya akses."}</p>`}
function about(){return`<h1>Tentang</h1><p class="sub">QINGS.WEB mengubah belajar bahasa menjadi misi. Kumpulkan XP, naikkan tingkat, dan bersaing di ranking.</p><div class="card" style="line-height:1.65"><p style="margin:0 0 14px;font-style:italic">Di balik gerbang kerajaan kata, ribuan huruf menunggu untuk dikenali. Bahasa Arab dengan lengkung tulisannya yang indah, Bahasa Inggris dengan jalan yang menghubungkan dunia, dan kamu berdiri di ambang pintunya.</p><p style="margin:0 0 14px">QINGS.WEB hadir untuk menemanimu melangkah dari kata pertama hingga percakapan yang lancar. Kenali asal-usul bahasanya, cari arti setiap kata di kamus, asah ingatanmu lewat latihan, lalu terima misi yang menguji sejauh mana kamu telah tumbuh.</p><p style="margin:0 0 14px">Setiap jawaban benar adalah langkah, setiap misi adalah anak tangga, dan setiap peringkat adalah jejak kerja kerasmu. Mampukah kamu melampaui yang lain dan meraih gelar Master?</p><p class="mu" style="margin:0">Dibuat oleh seorang developer yang percaya bahwa belajar bahasa bisa seasyik permainan. Kerajaan ini terus tumbuh, dengan bahasa dan petualangan baru yang akan menyusul.</p></div><button class="ghost" data-go="home">← Kembali</button>`}
function soon(n){return`<h1>${esc(n)}</h1><p class="sub">Bagian ini belum tersedia.</p><button class="ghost" data-go="home">← Kembali</button>`}
function quest(){const x=S.xp[lang],l=lvl(x),nx=LV.find(v=>v[0]>x);
 let b=`<button class="ghost" data-go="home">← Kembali</button><h1 style="margin-top:14px">${WORDS[lang].name}</h1>
<div class="row"><span class="lvl">${l[1]}</span><span class="mu">${x} XP${nx?` · ${nx[0]-x} XP lagi ke ${nx[1]}`:""}</span></div>
<div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" aria-selected="${tab===t[0]}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`;
 if(tab==="misi"){if(!q)newQ();
  b+=MS.map(m=>{const p=progress(m);return`<div class="card"><div class="row"><b>${m[0]}</b><span class="${p>=m[2]?"done":"mu"}">${p>=m[2]?"Selesai":p+"/"+m[2]}</span></div><div class="bar"><i style="width:${p/m[2]*100}%"></i></div></div>`}).join("");
  b+=`<div class="card"><span class="mu">Apa arti kata ini? (+10 XP)</span><div class="word"${lang==="ar"?' dir="rtl"':""}>${esc(q.w[0])}</div>${q.w[1]?`<span class="mu">${esc(q.w[1])}</span>`:""}<div class="ans">${q.o.map((o,i)=>`<button data-a="${i}" class="${pick!==null?(o===q.w[2]?"ok":o===pick?"bad":""):""}">${esc(o)}</button>`).join("")}</div>${pick!==null?`<button class="ghost" style="margin-top:12px" data-next>Soal berikutnya →</button>`:""}</div>`}
 if(tab==="intro")b+=INTRO[lang].map(x=>`<div class="card"><b>${x[0]}</b><p style="margin:6px 0 0">${x[1]}</p></div>`).join("");
 if(tab==="kamus")b+=kamus();
 if(tab==="latihan"){if(!cat)b+=`<p class="sub">Pilih kelompok kosakata.</p><div class="grid">${Object.keys(CATS).filter(k=>CATS[k][lang].length>3).map(k=>`<button class="opt" data-cat="${k}"><b>${CATS[k].n}</b><small>${CATS[k][lang].length} kata</small></button>`).join("")}</div>`;
  else b+=`<button class="ghost" data-back>← Kelompok lain</button><div class="card" style="margin-top:12px"><span class="mu">${CATS[cat].n} · apa artinya? (+10 XP)</span><div class="word"${lang==="ar"?' dir="rtl"':""}>${esc(pq.w[0])}</div>${pq.w[1]?`<span class="mu">${esc(pq.w[1])}</span>`:""}<div class="ans">${pq.o.map((o,i)=>`<button data-pa="${i}" class="${pp!==null?(o===pq.w[2]?"ok":o===pp?"bad":""):""}">${esc(o)}</button>`).join("")}</div>${pp!==null?`<button class="ghost" style="margin-top:12px" data-pn>Soal berikutnya →</button>`:""}</div>`}
 if(tab==="ranking")b+=ranking();
 b+=qmHTML();
 return b}
function render(){const a=document.activeElement&&document.activeElement.id,v=a?document.activeElement.value:"";
 let h=view==="home"?home():view==="about"?about():view==="quest"?quest():soon(MENU.find(m=>m[0]===view)[1]);
 $("app").innerHTML=`<header><b>QINGS.WEB</b><button class="ghost" data-rm>${S.rm?"Gerak: kurangi":"Kurangi gerak"}</button></header>`+h;
 document.documentElement.classList.toggle("rm",S.rm);
 if(view==="home"&&introNow){introNow=false;if(!S.rm)runIntro()}
 if(a&&$(a)){$(a).focus();try{$(a).setSelectionRange(v.length,v.length)}catch(e){}}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;if(d.qio!==undefined)return askQ();if(d.qa!==undefined)return ansQ(+d.qa);if(d.qm!==undefined)return tip();
 if(d.go){view=["ar","en"].includes(d.go)?"quest":d.go;if(view==="quest"){lang=d.go;tab="intro";q=null;cat=null}render()}
 else if(d.tab){tab=d.tab;cat=null;render()}else if(d.cat){cat=d.cat;pq=mk(CATS[cat][lang]);pp=null;render()}else if(d.back!==undefined){cat=null;render()}else if(d.pa!==undefined)pans(pq.o[+d.pa]);else if("pn"in d){pq=mk(CATS[cat][lang]);pp=null;render()}else if(d.chip){term=d.chip;render()}else if(d.a!==undefined)answer(q.o[+d.a]);
 else if("next"in d){newQ();render()}else if(d.sv!==undefined)toggleSave(+d.sv);
 else if("rm"in d){S.rm=!S.rm;save();render()}});
document.addEventListener("input",e=>{if(e.target.id==="s"){term=e.target.value;render()}
 if(e.target.id==="nm"){S.name=e.target.value.trim();save();clearTimeout(window._t);window._t=setTimeout(push,600)}});
function listen(){if(!db)return;try{db.collection("scores").orderBy("xp","desc").limit(100).onSnapshot(s=>{board=s.docs.map(d=>({name:d.data().name||"Anonim",xp:d.data().xp||0,me:d.id===uid}));if(tab==="ranking"&&document.activeElement.id!=="nm")render()},()=>{})}catch(e){}}
render();
(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(db&&u){uid=await u.id();listen();push()}}catch(e){db=null}})();
</script></body></html>
