sulit|صعب|ṣa‘b|||
dekat|قريب|qarīb|||
jauh|بعيد|ba‘īd|||
kaya|غني|ghanī|||
miskin|فقير|faqīr|||
manis|حلو|ḥulw|||
pahit|مر|murr|||
dingin|بارد|bārid|||
benar|صحيح|ṣaḥīḥ|||
rajin|مجتهد|mujtahid|||
tinggi|مرتفع|murtafi‘|||`.split("\n").forEach(l=>{const a=l.split("|");DICT.push({id:a[0],n:[a[1],a[2]],p:a[3]?[a[3],a[4]]:null,c:a[5]||""})});
[["sekolah","Alat sekolah"],["tubuh","Anggota tubuh"],["keluarga","Keluarga"],["profesi","Profesi"]].forEach(([k,n])=>{CATS[k]={n,ar:DICT.filter(e=>e.c===k).map(e=>[e.n[0],e.n[1],e.id]),en:[]}});
function mk(L){const w=L[Math.random()*L.length|0],o=[w[2]];while(o.length<4){const a=L[Math.random()*L.length|0][2];if(!o.includes(a))o.push(a)}return{w,o:o.sort(()=>Math.random()-.5)}}
function pans(a){if(pp!==null)return;pp=a;if(a===pq.w[2]){S.xp[lang]+=10;S.ok[lang]++;push()}save();render()}
const MS=[["Jawab 10 soal dengan benar","ok",10],["Kumpulkan 100 XP","xp",100],["Simpan 5 kata favorit","sv",5]];
let S={name:"",xp:{ar:0,en:0},ok:{ar:0,en:0},sv:{ar:[],en:[]},rm:false};
try{Object.assign(S,JSON.parse(localStorage.getItem("sq")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("sq",JSON.stringify(S))}catch(e){}};
let view="home",lang="ar",tab="misi",q=null,pick=null,term="",board=null,db=null,uid=null;
const $=s=>document.getElementById(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const lvl=x=>{let l=LV[0];LV.forEach(v=>{if(x>=v[0])l=v});return l};
const total=()=>S.xp.ar+S.xp.en;
function newQ(){const L=WORDS[lang].list,w=L[Math.random()*L.length|0];
 const o=[w[2]];while(o.length<4){const a=L[Math.random()*L.length|0][2];if(!o.includes(a))o.push(a)}
 q={w,o:o.sort(()=>Math.random()-.5)};pick=null}
function answer(a){if(pick!==null)return;pick=a;
 if(a===q.w[2]){S.xp[lang]+=10;S.ok[lang]++;push()}save();render()}
function toggleSave(i){const s=S.sv[lang],k=s.indexOf(i);k<0?s.push(i):s.splice(k,1);save();render()}
async function push(){if(!db||!uid||!S.name)return;try{await db.collection("scores").doc(uid).set({name:S.name,xp:total()})}catch(e){}}
function progress(m){const v=m[1]==="ok"?S.ok[lang]:m[1]==="xp"?S.xp[lang]:S.sv[lang].length;return Math.min(v,m[2])}
function home(){return`<h1>Apa yang kamu cari di sini?</h1><p class="sub">Pilih langkahmu, dan kejarlah impian itu.</p>
<div class="grid">${MENU.map((m,i)=>`<button class="opt" data-go="${m[0]}"><span class="n">0${i+1}</span><br><b>${m[1]}</b><small>${m[2]}</small></button>`).join("")}</div>`}
function about(){return`<h1>Tentang</h1><p class="sub">QINGS.WEB mengubah belajar bahasa menjadi misi. Kumpulkan XP, naikkan tingkat, dan bersaing di ranking.</p><div class="card" style="line-height:1.65"><p style="margin:0 0 14px;font-style:italic">Di balik gerbang kerajaan kata, ribuan huruf menunggu untuk dikenali. Bahasa Arab dengan lengkung tulisannya yang indah, Bahasa Inggris dengan jalan yang menghubungkan dunia, dan kamu berdiri di ambang pintunya.</p><p style="margin:0 0 14px">QINGS.WEB hadir untuk menemanimu melangkah dari kata pertama hingga percakapan yang lancar. Kenali asal-usul bahasanya, cari arti setiap kata di kamus, asah ingatanmu lewat latihan, lalu terima misi yang menguji sejauh mana kamu telah tumbuh.</p><p style="margin:0 0 14px">Setiap jawaban benar adalah langkah, setiap misi adalah anak tangga, dan setiap peringkat adalah jejak kerja kerasmu. Mampukah kamu melampaui yang lain dan meraih gelar Master?</p><p class="mu" style="margin:0">Dibuat oleh seorang developer yang percaya bahwa belajar bahasa bisa seasyik permainan. Kerajaan ini terus tumbuh, dengan bahasa dan petualangan baru yang akan menyusul.</p></div><button class="ghost" data-go="home">← Kembali</button>`}
function soon(n){return`<h1>${esc(n)}</h1><p class="sub">Bagian ini belum tersedia.</p><button class="ghost" data-go="home">← Kembali</button>`}
function quest(){const x=S.xp[lang],l=lvl(x),nx=LV.find(v=>v[0]>x);
 let b=`<button class="ghost" data-go="home">← Kembali</button><h1 style="margin-top:14px">${WORDS[lang].name}</h1>
<div class="row"><span class="lvl">${l[1]}</span><span class="mu">${x} XP${nx?` · ${nx[0]-x} XP lagi ke ${nx[1]}`:""}</span></div>
<div class="tabs" role="tablist">${TABS.map(t=>`<button class="tab" role="tab" aria-selected="${tab===t[0]}" data-tab="${t[0]}">${t[1]}</button>`).join("")}</div>`;
 if(tab==="misi"){if(!q)newQ();
  b+=MS.map(m=>{const p=progress(m);return`<div class="card"><div class="row"><b>${m[0]}</b><span class="${p>=m[2]?"done":"mu"}">${p>=m[2]?"Selesai":p+"/"+m[2]}</span></div><div class="bar"><i style="width:${p/m[2]*100}%"></i></div></div>`}).join("");
  b+=`<div class="card"><span class="mu">Apa arti kata ini? (+10 XP)</span><div class="word"${lang==="ar"?' dir="rtl"':""}>${esc(q.w[0])}</div>${q.w[1]?`<span class="mu">${esc(q.w[1])}</span>`:""}<div class="ans">${q.o.map((o,i)=>`<button data-a="${i}" class="${pick!==null?(o===q.w[2]?"ok":o===pick?"bad":""):""}">${esc(o)}</button>`).join("")}</div>${pick!==null?`<button class="ghost" style="margin-top:12px" data-next>Soal berikutnya →</button>`:""}</div>`}
 if(tab==="intro")b+=INTRO[lang].map(x=>`<div class="card"><b>${x[0]}</b><p style="margin:6px 0 0">${x[1]}</p></div>`).join("");
 if(tab==="kamus"){if(lang!=="ar")b+=`<div class="card"><p class="mu">Kamus Bahasa Inggris segera hadir.</p></div>`;else{const t=term.trim().toLowerCase(),r=t?DICT.filter(e=>e.id.includes(t)||t.includes(e.id)).slice(0,3):[];
  b+=`<div class="dict"><div class="card"><span class="mu">Indonesia</span><input id="s" placeholder="Ketik kata, mis. pergi" value="${esc(term)}" autocomplete="off"><div class="chips">${DICT.slice(0,6).map(e=>`<button class="ghost" data-chip="${e.id}">${e.id}</button>`).join("")}</div></div><div class="card"><span class="mu">Arab</span>${!t?`<p class="mu">Terjemahan muncul di sini.</p>`:!r.length?`<p class="mu">Kata belum ada di kamus.</p>`:r.map(e=>`<span class="lb">KATA BENDA / SIFAT</span><div class="ar" dir="rtl">${e.n[0]}</div><span class="mu">${e.n[1]}</span>${e.p?`<span class="lb">JAMAK</span><div class="ar" dir="rtl">${e.p[0]}</div><span class="mu">${e.p[1]}</span>`:""}${e.v?`<span class="lb">KATA KERJA</span><div class="ar" dir="rtl">${e.v[0][0]}</div><span class="mu">${e.v[0][1]} · telah ${e.id}</span><div class="ar" dir="rtl">${e.v[1][0]}</div><span class="mu">${e.v[1][1]} · sedang ${e.id}</span>`:""}`).join("<hr style='border:0;border-top:1px solid var(--line)'>")}</div></div>`}}
 if(tab==="latihan"){if(!cat)b+=`<p class="sub">Pilih kelompok kosakata.</p><div class="grid">${Object.keys(CATS).filter(k=>CATS[k][lang].length>3).map(k=>`<button class="opt" data-cat="${k}"><b>${CATS[k].n}</b><small>${CATS[k][lang].length} kata</small></button>`).join("")}</div>`;
  else b+=`<button class="ghost" data-back>← Kelompok lain</button><div class="card" style="margin-top:12px"><span class="mu">${CATS[cat].n} · apa artinya? (+10 XP)</span><div class="word"${lang==="ar"?' dir="rtl"':""}>${esc(pq.w[0])}</div>${pq.w[1]?`<span class="mu">${esc(pq.w[1])}</span>`:""}<div class="ans">${pq.o.map((o,i)=>`<button data-pa="${i}" class="${pp!==null?(o===pq.w[2]?"ok":o===pp?"bad":""):""}">${esc(o)}</button>`).join("")}</div>${pp!==null?`<button class="ghost" style="margin-top:12px" data-pn>Soal berikutnya →</button>`:""}</div>`}
 if(tab==="ranking"){
  b+=`<div class="card"><span class="mu">Nama di ranking</span><input id="nm" maxlength="16" placeholder="Nama panggilan" value="${esc(S.name)}"></div>`;
  b+=board?`<div class="card"><ol>${board.map(r=>`<li class="row"><span>${esc(r.name)}${r.me?" (kamu)":""}</span><b>${r.xp} XP</b></li>`).join("")||"<li>Belum ada peserta.</li>"}</ol></div><p class="mu">Skor total semua bahasa. Siapa pun bisa melampauimu.</p>`:`<div class="card"><p class="mu">Ranking bersama butuh akun. Skor total kamu: <b>${total()} XP</b> (tersimpan di perangkat ini).</p></div>`}
 return b}
function render(){const a=document.activeElement&&document.activeElement.id,v=a?document.activeElement.value:"";
 let h=view==="home"?home():view==="about"?about():view==="quest"?quest():soon(MENU.find(m=>m[0]===view)[1]);
 $("app").innerHTML=`<header><b>QINGS.WEB</b><button class="ghost" data-rm>${S.rm?"Gerak: kurangi":"Kurangi gerak"}</button></header>`+h;
 document.documentElement.classList.toggle("rm",S.rm);
 if(a&&$(a)){$(a).focus();try{$(a).setSelectionRange(v.length,v.length)}catch(e){}}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.go){view=["ar","en"].includes(d.go)?"quest":d.go;if(view==="quest"){lang=d.go;tab="intro";q=null;cat=null}render()}
 else if(d.tab){tab=d.tab;cat=null;render()}else if(d.cat){cat=d.cat;pq=mk(CATS[cat][lang]);pp=null;render()}else if(d.back!==undefined){cat=null;render()}else if(d.pa!==undefined)pans(pq.o[+d.pa]);else if("pn"in d){pq=mk(CATS[cat][lang]);pp=null;render()}else if(d.chip){term=d.chip;render()}else if(d.a!==undefined)answer(q.o[+d.a]);
 else if("next"in d){newQ();render()}else if(d.sv!==undefined)toggleSave(+d.sv);
 else if("rm"in d){S.rm=!S.rm;save();render()}});
document.addEventListener("input",e=>{if(e.target.id==="s"){term=e.target.value;render()}
 if(e.target.id==="nm"){S.name=e.target.value.trim();save();clearTimeout(window._t);window._t=setTimeout(push,600)}});
function listen(){if(!db)return;try{db.collection("scores").orderBy("xp","desc").limit(10).onSnapshot(s=>{board=s.docs.map(d=>({name:d.data().name||"Anonim",xp:d.data().xp||0,me:d.id===uid}));if(tab==="ranking"&&document.activeElement.id!=="nm")render()},()=>{})}catch(e){}}
render();
(async()=>{try{db=await claude.use("db");const u=await claude.use("user");if(db&&u){uid=await u.id();listen();push()}}catch(e){db=null}})();
</script></body></html>
